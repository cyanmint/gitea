name: Copilot Preview — Build Backend

on:
  push:
    branches:
      - copilot/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build Go backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Fetch full history so `git describe` reports the correct version tag.
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install backend dependencies
        run: make deps-backend

      - name: Build backend binary
        run: make backend
        env:
          TAGS: sqlite sqlite_unlock_notify

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitea-backend-${{ github.ref_name }}-${{ github.sha }}
          path: gitea
          retention-days: 14
